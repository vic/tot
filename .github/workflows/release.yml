name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    strategy:
      matrix:
        include:
          - { system: x86_64-linux, runner: ubuntu-latest }
          - { system: aarch64-linux, runner: ubuntu-24.04-arm }
          - { system: aarch64-darwin, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: build static-tot
        run: nix build .#static-tot --print-build-logs
      - name: pack it
        run: .github/pack-release.sh "$(readlink -f result)" ${{ matrix.system }} dist
      - name: it runs from the unpacked archive
        run: |
          tar -xzf dist/tot-${{ matrix.system }}.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && tot-${{ matrix.system }}/tot --help
      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/tot-${{ matrix.system }}.tar.gz --clobber
